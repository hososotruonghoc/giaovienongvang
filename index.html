<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Ong Vàng - Quản Lý (Giáo Viên)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g50:#ECFDF5;--g100:#D1FAE5;--g200:#A7F3D0;--g300:#6EE7B7;--g400:#34D399;--g500:#10B981;--g600:#059669;--g700:#047857;--g800:#065F46;--t50:#F0FDFA;--t100:#CCFBF1;--t200:#99F6E4;--t400:#2DD4BF;--t500:#14B8A6;--t600:#0D9488;--s50:#F0F9FF;--s100:#E0F2FE;--s400:#38BDF8;--s500:#0EA5E9;--a50:#FFFBEB;--a200:#FDE68A;--a400:#FBBF24;--a600:#D97706;--r50:#FFF1F2;--r100:#FCE7F3;--r400:#FB7185;--r500:#F43F5E;--x50:#F9FAFB;--x100:#F3F4F6;--x200:#E5E7EB;--x400:#9CA3AF;--x500:#6B7280;--x700:#374151;--x800:#1F2937;--fd:'Montserrat',sans-serif;--fb:'Quicksand',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--fb);}body{min-height:100vh;background:linear-gradient(160deg,var(--g50),var(--t50),var(--s50));}
h1,h2,h3,.hd{font-family:var(--fd);font-weight:800;}button{cursor:pointer;border:none;outline:none;}textarea,input,select{outline:none;font-family:var(--fb);}
::-webkit-scrollbar{width:7px;}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--t400),var(--g500));border-radius:99px;}
@keyframes floatBee{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes aiPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 20px 8px rgba(16,185,129,.15)}}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}.deco>div{position:absolute;}
.nav-bar{position:sticky;top:0;z-index:40;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,var(--g50),var(--t50),var(--g50));border-bottom:3px solid var(--g300);}
.nav-tabs{display:flex;padding:4px;border-radius:14px;gap:4px;background:var(--g100);border:2px solid var(--g200);}
.nav-tab{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:800;color:var(--g700);background:transparent;transition:all .2s;}
.nav-tab.active{background:white;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.nav-tab:hover:not(.active){background:rgba(255,255,255,.5);}
.teacher-wrap{min-height:100vh;background:linear-gradient(180deg,var(--g50),var(--t50));}
.topbar{padding:16px 24px;background:rgba(255,255,255,.8);border-bottom:3px solid var(--g300);backdrop-filter:blur(8px);}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;background:linear-gradient(135deg,var(--g500),var(--t500));}
.tgrid{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:900px){.tgrid,.ggrid{grid-template-columns:1fr !important;}}
.panel{background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);padding:24px;border:2px solid var(--g200);}
.panel-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--g800);display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.cfg-form{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}.cfg-row{display:flex;gap:10px;}.cfg-row>*{flex:1;}
.cfg-f label{display:block;font-size:12px;font-weight:700;color:var(--g700);margin-bottom:4px;}
.cfg-f input,.cfg-f select{width:100%;padding:10px 12px;border:2px solid var(--g200);border-radius:10px;font-size:14px;font-weight:600;color:var(--g800);transition:all .2s;}
.cfg-f input:focus,.cfg-f select:focus{border-color:var(--g400);background:var(--g50);}
.drop-zone{border:3px dashed var(--g300);border-radius:16px;padding:24px;text-align:center;cursor:pointer;background:var(--g50);}
.drop-zone.has-file{border-color:var(--t400);background:var(--t50);}
.btn-parse{margin-top:8px;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--g500),var(--t500));}
.btn-parse:disabled{opacity:.6;}
.btn-save{display:flex;align-items:center;gap:8px;padding:10px 20px;font-weight:800;color:white;border-radius:12px;background:linear-gradient(135deg,var(--g500),var(--g600));box-shadow:0 4px 16px rgba(16,185,129,.3);}
.q-edit-card{padding:12px;border-radius:12px;border:2px solid var(--g200);background:var(--x50);margin-bottom:8px;}
.q-edit-card.editing{border-color:var(--g400);background:var(--g50);}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;}
.opt-preview{font-size:12px;padding:5px 10px;border-radius:8px;font-weight:600;}
.opt-preview.correct{background:var(--g100);color:var(--g700);border:1px solid var(--g300);}
.opt-preview.wrong{background:white;color:var(--x500);border:1px solid var(--x200);}
.opt-correct-btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--x200);background:white;color:var(--x400);}
.opt-correct-btn.correct{background:var(--g500);border-color:var(--g500);color:white;}
.stu-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
.stu-table th{background:var(--g600);color:white;padding:8px;font-weight:700;text-align:left;}
.stu-table td{padding:8px;border-bottom:1px solid var(--g200);}
.stu-table tr:hover td{background:var(--g50);}
.ggrid{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:3fr 2fr;gap:24px;}
.student-tab{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--x100);color:var(--x500);border:2px solid transparent;margin:3px;}
.student-tab.active{background:var(--g100);color:var(--g700);border-color:var(--g300);}
.answer-panel{background:rgba(255,255,255,.9);border-radius:16px;overflow:hidden;border:2px solid var(--g200);}
.answer-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--g50);border-bottom:2px solid var(--g200);flex-wrap:wrap;gap:8px;}
.rubric-panel{background:rgba(255,255,255,.9);border-radius:16px;padding:20px;border:2px solid var(--g200);}
.rubric-item{background:var(--g50);border-radius:12px;padding:12px;margin-bottom:10px;}
.rubric-scores{display:flex;gap:6px;}
.rubric-score-btn{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:800;border:2px solid var(--x200);background:white;color:var(--x500);}
.rubric-score-btn.a-max{background:var(--g500);border-color:var(--g500);color:white;}
.rubric-score-btn.a-mid{background:var(--a400);border-color:var(--a400);color:white;}
.rubric-score-btn.a-zero{background:var(--r400);border-color:var(--r400);color:white;}
.total-score-box{margin-top:14px;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--g50),var(--t50));border:2px solid var(--g200);}
.total-score-num{font-family:var(--fd);font-size:28px;font-weight:800;color:var(--g700);}
.comment-panel{background:rgba(255,255,255,.9);border-radius:16px;padding:20px;border:2px solid var(--g200);margin-top:16px;}
.comment-textarea{width:100%;height:80px;padding:12px;border:2px solid var(--g200);border-radius:12px;font-size:13px;resize:none;font-weight:600;}
.comment-textarea:focus{border-color:var(--g400);background:var(--g50);}
.canned-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.canned-tag{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;background:var(--g50);color:var(--g700);border:1px solid var(--g200);}
.canned-tag:hover{background:var(--g100);}
.btn-ai{width:100%;padding:14px;border-radius:12px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--g500),var(--t500));margin-bottom:12px;}
.btn-ai:disabled{opacity:.6;}.btn-ai.pulsing{animation:aiPulse 1.5s ease-in-out infinite;}
.btn-save-grade{width:100%;padding:14px;border-radius:12px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;}
.btn-save-grade.unsaved{background:linear-gradient(135deg,var(--g500),var(--t500));color:white;}
.btn-save-grade.saved{background:var(--g100);color:var(--g600);border:2px solid var(--g300);}
.res-card{padding:12px;border-radius:12px;border:2px solid var(--g200);background:white;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.res-card .name{font-weight:800;color:var(--g800);}
.res-card .score{font-weight:800;font-family:var(--fd);color:var(--g600);}
.res-card .detail{font-size:12px;color:var(--x500);font-weight:600;}
.hidden{display:none !important;}.spinner{animation:spin 1s linear infinite;display:inline-block;}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:100;padding:14px 28px;border-radius:14px;background:var(--g500);color:white;font-weight:800;font-size:15px;box-shadow:0 8px 30px rgba(16,185,129,.4);animation:slideUp .4s ease-out;}
</style>
</head>
<body>
<div class="deco"><div style="top:10px;left:8px;animation:floatBee 4s ease-in-out infinite" id="d1"></div><div style="bottom:80px;right:40px;animation:floatBee 5s ease-in-out infinite 2s" id="d2"></div><div style="top:50%;left:5%;font-size:18px;opacity:.35">🌸</div><div style="top:60px;left:20%;font-size:40px;opacity:.12">☁️</div><div style="bottom:40px;left:30%;font-size:20px;opacity:.4">🌼</div></div>
<nav class="nav-bar"><div id="nb" style="animation:wiggle 2s ease-in-out infinite"></div><div class="nav-tabs"><button class="nav-tab active" data-tab="teacher"><span>📝</span><span>Tạo Đề Thi</span></button><button class="nav-tab" data-tab="grading"><span>✅</span><span>Chấm Bài</span></button></div></nav>
<div id="tab-teacher"></div><div id="tab-grading" class="hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyt6623ltT0g86V_cIxqFmtSAfCnVqKNq1O5Li5klICguuFtF_yEzcfIP-X3fvMVaI1/exec';
function B(sz){return`<svg width="${sz}" height="${sz}" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="25" cy="85" rx="30" ry="18" fill="#B3E5FC" opacity=".5" transform="rotate(-25 25 85)"/><ellipse cx="115" cy="85" rx="30" ry="18" fill="#B3E5FC" opacity=".5" transform="rotate(25 115 85)"/><ellipse cx="70" cy="135" rx="30" ry="38" fill="#FFD93D"/><ellipse cx="70" cy="128" rx="28" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="148" rx="29" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="168" rx="27" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="75" rx="32" ry="30" fill="#FFD93D"/><path d="M38 65 Q42 45 70 38 Q98 45 102 65 Q94 57 70 55 Q46 57 38 65Z" fill="#1a1a2e"/><ellipse cx="56" cy="72" rx="10" ry="11" fill="white"/><ellipse cx="84" cy="72" rx="10" ry="11" fill="white"/><circle cx="58" cy="72" r="7" fill="#2563EB"/><circle cx="86" cy="72" r="7" fill="#2563EB"/><circle cx="55" cy="68" r="3" fill="white"/><circle cx="83" cy="68" r="3" fill="white"/><path d="M50 88 Q60 100 70 98 Q80 100 90 88" stroke="#1a1a2e" stroke-width="2" fill="#FF6B8A"/><ellipse cx="38" cy="84" rx="7" ry="4" fill="#FF9999" opacity=".3"/><ellipse cx="102" cy="84" rx="7" ry="4" fill="#FF9999" opacity=".3"/><path d="M56 42 Q48 22 40 14" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M84 42 Q92 22 100 14" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="38" cy="12" r="5" fill="#FFD93D"/><circle cx="102" cy="12" r="5" fill="#FFD93D"/></svg>`;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500);}
document.getElementById('d1').innerHTML=B(34);document.getElementById('d2').innerHTML=B(26);document.getElementById('nb').innerHTML=B(30);
document.querySelectorAll('.nav-tab').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['teacher','grading'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab);});if(b.dataset.tab==='teacher')renderT();if(b.dataset.tab==='grading')renderG();});});

const CFG={schoolName:"Trường Tiểu Học Diễn Liên",teacherName:"Cô Nguyễn Thị Hoa",subject:"Toán",grade:3,semester:"Cuối năm học",schoolYear:"2025 - 2026",duration:2400,totalPoints:10};
const students=[{stt:1,maHS:'HS001',hoTen:'Nguyễn Văn An',ngaySinh:'15/03/2017',lop:'3A',truong:'TH Diễn Liên'},{stt:2,maHS:'HS002',hoTen:'Trần Thị Bình',ngaySinh:'22/07/2017',lop:'3A',truong:'TH Diễn Liên'},{stt:3,maHS:'HS003',hoTen:'Lê Hoàng Minh',ngaySinh:'01/11/2017',lop:'3B',truong:'TH Diễn Liên'},{stt:4,maHS:'HS004',hoTen:'Phạm Thị Mai',ngaySinh:'30/05/2017',lop:'3B',truong:'TH Diễn Liên'},{stt:5,maHS:'HS005',hoTen:'Hoàng Đức Anh',ngaySinh:'08/09/2017',lop:'3A',truong:'TH Diễn Liên'}];
const canned=["Em làm rất tốt! 🌟","Chú ý lỗi chính tả!","Cần trình bày sạch hơn!","Phép tính đúng! 🐝","Viết đầy đủ lời giải nhé!","Xem lại đáp số.","Trình bày khoa học! 👍","Cố gắng hơn! 💪","Xuất sắc! 🏆"];

/* ═══ TEACHER MODULE ═══ */
const T={file:null,fileObj:null,parsed:false,examData:null,editingQ:null,saving:false,saved:false,showAddStudent:false};

function addQ(type){
  if(!T.examData)T.examData={examId:'exam_'+Date.now(),title:'Kiểm Tra '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade,questions:[]};
  var qs=T.examData.questions,order=qs.length+1,id='q'+order;
  var isTN=(type!=='essay');
  var q={id:id,type:type,cat:isTN?'tn':'tl',order:order,points:isTN?1:2,content:'',correctAnswer:''};
  if(type==='mcq'){q.options=[{id:'a',text:''},{id:'b',text:''},{id:'c',text:''},{id:'d',text:''}];q.correctAnswer='a';}
  if(type==='true_false')q.correctAnswer='true';
  if(type==='fill_in'){q.content='Kết quả của ... là _____ .';q.hint='';}
  if(type==='essay')q.rubric=[{criteriaId:'r1',label:'Nội dung đúng',maxScore:1},{criteriaId:'r2',label:'Đáp số đúng',maxScore:0.5},{criteriaId:'r3',label:'Trình bày',maxScore:0.5}];
  qs.push(q);T.parsed=true;T.editingQ=id;renderT();
  showToast('➕ Đã thêm câu '+order);
}
function deleteQ(idx){if(!T.examData)return;T.examData.questions.splice(idx,1);T.examData.questions.forEach(function(q,i){q.order=i+1;q.id='q'+(i+1);});if(!T.examData.questions.length)T.parsed=false;renderT();}
function moveQ(idx,dir){if(!T.examData)return;var qs=T.examData.questions,ni=idx+dir;if(ni<0||ni>=qs.length)return;var tmp=qs[idx];qs[idx]=qs[ni];qs[ni]=tmp;qs.forEach(function(q,i){q.order=i+1;q.id='q'+(i+1);});renderT();}

function addNewStudent(){var ma=document.getElementById('add-ma')?.value,ten=document.getElementById('add-ten')?.value,ns=document.getElementById('add-ns')?.value,lop=document.getElementById('add-lop')?.value,truong=document.getElementById('add-truong')?.value;if(!ma||!ten){showToast('⚠️ Nhập Mã HS và Họ tên!');return;}students.push({stt:students.length+1,maHS:ma,hoTen:ten,ngaySinh:ns||'',lop:lop||'',truong:truong||'TH Diễn Liên'});T.showAddStudent=false;showToast('✅ Đã thêm: '+ten);renderT();}

function publishExam(){
  if(!T.examData||!T.examData.questions.length){showToast('⚠️ Chưa có câu hỏi!');return;}
  T.saving=true;renderT();
  var exam={title:T.examData.title||('Kiểm Tra '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade),questions:T.examData.questions};
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publishExam',exam:exam,config:CFG})})
    .then(r=>r.json()).then(data=>{
      T.saving=false;T.saved=true;renderT();
      showToast(data.success?'✅ Đã xuất bản! HS có thể vào làm bài.':'⚠️ '+(data.error||'Lỗi'));
      setTimeout(()=>{T.saved=false;renderT();},3000);
    }).catch(err=>{T.saving=false;renderT();showToast('⚠️ Lỗi: '+err.message);});
}

function renderT(){
  var el=document.getElementById('tab-teacher');
  var sems=['Cuối năm học','Giữa kỳ I','Cuối kỳ I','Giữa kỳ II','Cuối kỳ II'];
  var subs=['Toán','Tiếng Việt','Khoa học','Lịch sử và Địa lý','Công nghệ','Tin học','Tiếng Anh'];
  var stuRows=students.map(function(s,i){return'<tr><td>'+s.stt+'</td><td>'+s.maHS+'</td><td style="text-align:left">'+s.hoTen+'</td><td>'+s.ngaySinh+'</td><td>'+s.lop+'</td><td>'+(s.truong||'')+'</td><td><button style="color:var(--r400);background:none;font-size:14px" onclick="students.splice('+i+',1);renderT();">✕</button></td></tr>';}).join('');
  var addForm=T.showAddStudent?'<div style="background:var(--g50);border-radius:12px;padding:14px;margin-top:12px;border:2px solid var(--g200);animation:fadeIn .3s"><div class="cfg-row"><div class="cfg-f"><label>Mã HS</label><input id="add-ma" placeholder="HS006"></div><div class="cfg-f"><label>Họ và tên</label><input id="add-ten" placeholder="Nguyễn Văn..."></div></div><div class="cfg-row"><div class="cfg-f"><label>Ngày sinh</label><input id="add-ns" placeholder="01/01/2017"></div><div class="cfg-f"><label>Lớp</label><input id="add-lop" placeholder="3A"></div></div><div class="cfg-f" style="margin-top:8px"><label>Tên trường</label><input id="add-truong" placeholder="TH Diễn Liên" value="TH Diễn Liên"></div><button style="margin-top:8px;padding:10px 20px;border-radius:10px;font-weight:800;color:white;background:var(--g500);font-size:13px" onclick="addNewStudent()">✅ Thêm</button> <button style="padding:10px 20px;border-radius:10px;font-weight:700;color:var(--x500);background:var(--x100);font-size:13px" onclick="T.showAddStudent=false;renderT();">Hủy</button></div>':'';

  el.innerHTML='<div class="teacher-wrap"><div class="topbar"><div class="topbar-inner"><div class="topbar-left"><div class="topbar-icon">⚙️</div><div><h1 class="hd" style="font-size:20px;color:var(--g800)">Bảng Quản Lý Đề Thi</h1><p style="font-size:13px;font-weight:600;color:var(--g700)">Trang dành cho Giáo viên</p></div></div><div style="display:flex;align-items:center;gap:12px"><div style="animation:wiggle 3s ease-in-out infinite">'+B(30)+'</div>'+(T.parsed?'<button class="btn-save" onclick="publishExam()">'+(T.saving?'⏳ Đang xuất bản...':T.saved?'✅ Đã xuất bản!':'💾 Lưu & Xuất bản')+'</button>':'')+'</div></div></div><div class="tgrid"><div style="animation:fadeIn .5s ease-out">'+
  /* Config panel */
  '<div class="panel"><div class="panel-title">🏫 Thông tin bài kiểm tra</div><div class="cfg-form"><div class="cfg-f"><label>Tên trường</label><input value="'+CFG.schoolName+'" onchange="CFG.schoolName=this.value"></div><div class="cfg-row"><div class="cfg-f"><label>Giáo viên</label><input value="'+CFG.teacherName+'" onchange="CFG.teacherName=this.value"></div><div class="cfg-f"><label>Năm học</label><input value="'+CFG.schoolYear+'" onchange="CFG.schoolYear=this.value"></div></div><div class="cfg-row"><div class="cfg-f"><label>Môn học</label><select onchange="CFG.subject=this.value">'+subs.map(function(s){return'<option'+(CFG.subject===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div><div class="cfg-f"><label>Lớp</label><select onchange="CFG.grade=+this.value">'+[1,2,3,4,5].map(function(g){return'<option value="'+g+'"'+(CFG.grade===g?' selected':'')+'>'+g+'</option>';}).join('')+'</select></div></div><div class="cfg-row"><div class="cfg-f"><label>Kỳ kiểm tra</label><select onchange="CFG.semester=this.value">'+sems.map(function(s){return'<option'+(CFG.semester===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div><div class="cfg-f"><label>Thời gian (phút)</label><input type="number" value="'+Math.floor(CFG.duration/60)+'" onchange="CFG.duration=+this.value*60"></div></div></div></div>'+
  /* Student panel */
  '<div class="panel" style="margin-top:16px"><div class="panel-title">👩‍🎓 Thông tin học sinh <span style="margin-left:auto;font-size:13px;font-weight:600;color:var(--g500)">'+students.length+' em</span></div><div style="display:flex;gap:8px;margin-bottom:8px"><button style="padding:8px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:var(--g500)" onclick="T.showAddStudent=true;renderT();">➕ Thêm mới HS</button></div>'+addForm+'<div style="max-height:200px;overflow-y:auto;margin-top:8px"><table class="stu-table"><thead><tr><th>TT</th><th>Mã HS</th><th>Họ tên</th><th>Ngày sinh</th><th>Lớp</th><th>Trường</th><th></th></tr></thead><tbody>'+stuRows+'</tbody></table></div></div>'+
  /* Exam builder panel */
  '<div class="panel" style="margin-top:16px"><div class="panel-title">✏️ Biên soạn đề thi</div><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--g500),var(--t500))" onclick="addQ(\'mcq\')">➕ Chọn ĐA</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--t500),var(--s500))" onclick="addQ(\'true_false\')">➕ Đúng/Sai</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--s500),#6366F1)" onclick="addQ(\'fill_in\')">➕ Điền khuyết</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,#EC4899,#F43F5E)" onclick="addQ(\'essay\')">➕ Tự luận</button></div>'+
  (T.examData&&T.examData.questions.length?'<div style="padding:10px 14px;background:var(--g50);border-radius:10px;border:1px solid var(--g200);margin-bottom:12px;font-size:13px;font-weight:700;color:var(--g700)">📋 '+T.examData.questions.length+' câu | TN: '+T.examData.questions.filter(function(q){return q.cat==="tn"}).length+' | TL: '+T.examData.questions.filter(function(q){return q.cat==="tl"}).length+'</div>':'<div style="padding:14px;background:var(--a50);border-radius:10px;border:1px solid var(--a200);margin-bottom:12px;text-align:center;font-size:13px;font-weight:700;color:var(--a600)">💡 Bấm các nút trên để thêm câu hỏi</div>')+
  '</div>'+
  '<div class="panel" style="margin-top:16px"><div class="panel-title">📤 Tải file đề thi</div>'+
  '<div style="border:3px dashed var(--g300);border-radius:16px;padding:30px;text-align:center;cursor:pointer;background:var(--g50)" onclick="showToast(\'🐝 Tính năng AI đọc đề thi đang được cập nhật ở phiên bản sau!\')">'+
  '<div style="font-size:48px;margin-bottom:10px">📎</div>'+
  '<p style="font-size:17px;font-weight:700;color:var(--g700)">Kéo thả file vào đây</p>'+
  '<p style="font-size:13px;font-weight:600;color:var(--g600)">PDF hoặc Ảnh chụp đề (PNG, JPG)</p>'+
  '</div>'+
  '<p style="font-size:11px;color:var(--g600);margin-top:8px;font-weight:600">🐝 Ong vàng AI sẽ đọc file và tự động tạo câu hỏi. Hỗ trợ: PDF, PNG, JPG</p>'+
  '</div></div>'+
  /* Preview panel */
  '<div style="animation:fadeIn .6s ease-out"><div class="panel" style="min-height:400px"><div class="panel-title">👁️ Xem trước & Chỉnh sửa</div>'+(!T.parsed?'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:250px;color:var(--g300)"><div style="animation:floatBee 3s ease-in-out infinite;opacity:.6">'+B(64)+'</div><p style="margin-top:16px;font-size:16px;font-weight:700">Thêm câu hỏi để bắt đầu</p></div>':'<div style="max-height:600px;overflow-y:auto;padding-right:8px">'+T.examData.questions.map(function(q,i){return rTQ(q,i);}).join('')+'</div>')+'</div></div></div></div>';
}

function rTQ(q,i){var isTN=q.cat==='tn';var subL={mcq:'Chọn ĐA',true_false:'Đ/S',fill_in:'Điền',essay:'TL'};var ed=T.editingQ===q.id;var b='';
if(ed){b='<textarea style="width:100%;padding:8px;border:2px solid var(--g200);border-radius:10px;font-size:13px;resize:none;font-family:var(--fb)" rows="2" onchange="T.examData.questions['+i+'].content=this.value">'+q.content+'</textarea>';
if(q.type==='mcq')b+=q.options.map(function(o){return'<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><button class="opt-correct-btn '+(q.correctAnswer===o.id?'correct':'')+'" onclick="T.examData.questions['+i+'].correctAnswer=\''+o.id+'\';renderT();">'+(q.correctAnswer===o.id?'✓':o.id.toUpperCase())+'</button><input style="flex:1;padding:6px;border:2px solid var(--g200);border-radius:8px;font-size:13px;font-family:var(--fb)" value="'+o.text+'" onchange="T.examData.questions['+i+'].options.find(function(x){return x.id===\''+o.id+'\'}).text=this.value"></div>';}).join('');
if(q.type==='true_false')b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">ĐA:</span><select style="padding:6px;border:2px solid var(--g200);border-radius:8px;font-weight:700" onchange="T.examData.questions['+i+'].correctAnswer=this.value"><option value="true"'+(q.correctAnswer==='true'?' selected':'')+'>Đúng</option><option value="false"'+(q.correctAnswer==='false'?' selected':'')+'>Sai</option></select></div>';
if(q.type==='fill_in'){b+='<p style="font-size:11px;color:var(--a600);margin-top:4px;font-weight:600">💡 Dùng _____ (5 gạch dưới) để đánh dấu chỗ trống cần điền</p>';b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">ĐA:</span><input style="flex:1;padding:6px;border:2px solid var(--t400);border-radius:8px;font-size:13px;font-weight:700;color:var(--g700)" value="'+q.correctAnswer+'" onchange="T.examData.questions['+i+'].correctAnswer=this.value"></div>';b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">Gợi ý:</span><input style="flex:1;padding:6px;border:2px solid var(--g200);border-radius:8px;font-size:13px;color:var(--g700)" value="'+(q.hint||'')+'" onchange="T.examData.questions['+i+'].hint=this.value" placeholder="Gợi ý cho HS (tùy chọn)"></div>';}
}else{b='<p style="font-size:13px;font-weight:600;color:var(--x700)">'+(q.content||'<em style="color:var(--x400)">(Chưa nhập nội dung)</em>')+'</p>';
if(q.type==='mcq'&&q.options)b+='<div class="opt-grid">'+q.options.map(function(o){return'<div class="opt-preview '+(q.correctAnswer===o.id?'correct':'wrong')+'">'+o.id.toUpperCase()+'. '+(o.text||'...')+'</div>';}).join('')+'</div>';
if(q.type==='true_false')b+='<div style="margin-top:6px"><span class="opt-preview correct" style="display:inline-block">ĐA: '+(q.correctAnswer==='true'?'Đúng':'Sai')+'</span></div>';
if(q.type==='fill_in')b+='<div style="margin-top:6px"><span class="opt-preview correct" style="display:inline-block">ĐA: '+(q.correctAnswer||'...')+'</span></div>';}
return'<div class="q-edit-card '+(ed?'editing':'')+'"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:'+(isTN?'var(--t100)':'var(--r100)')+';color:'+(isTN?'var(--t600)':'var(--r500)')+'">'+(isTN?'TN':'TL')+'</span><span style="font-size:10px;font-weight:600;color:var(--x400);background:var(--x100);padding:1px 6px;border-radius:4px">'+subL[q.type]+'</span><span style="font-size:13px;font-weight:700;color:var(--g800)">Câu '+(i+1)+'</span><span style="font-size:11px;font-weight:600;color:var(--g600)">'+q.points+'đ</span></div><div style="display:flex;gap:4px"><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:12px" onclick="moveQ('+i+',-1)">⬆️</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:12px" onclick="moveQ('+i+',1)">⬇️</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:14px" onclick="T.editingQ=T.editingQ===\''+q.id+'\'?null:\''+q.id+'\';renderT();">✏️</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--r400);font-size:12px" onclick="if(confirm(\'Xóa câu '+(i+1)+'?\'))deleteQ('+i+')">🗑️</button></div></div>'+b+'</div>';}

/* ═══ GRADING MODULE ═══ */
const G={results:[],loading:false,sel:-1};

function renderG(){
  var el=document.getElementById('tab-grading');
  if(!G.results.length&&!G.loading){
    el.innerHTML='<div class="teacher-wrap"><div class="topbar"><div class="topbar-inner"><div class="topbar-left"><div class="topbar-icon">📋</div><div><h1 class="hd" style="font-size:20px;color:var(--g800)">Chấm Bài & Kết Quả</h1></div></div><div style="display:flex;gap:8px"><button class="btn-save" onclick="loadResults()">📥 Tải kết quả từ Sheets</button></div></div></div><div style="max-width:800px;margin:0 auto;padding:40px;text-align:center"><div style="animation:floatBee 3s ease-in-out infinite;display:flex;justify-content:center;margin-bottom:16px;opacity:.5">'+B(64)+'</div><p style="font-size:16px;font-weight:700;color:var(--g600)">Bấm "Tải kết quả" để xem bài làm của học sinh</p></div></div>';
    return;
  }
  if(G.loading){
    el.innerHTML='<div class="teacher-wrap"><div style="padding:60px;text-align:center"><span class="spinner">⏳</span> Đang tải...</div></div>';
    return;
  }
  var list=G.results.map(function(r,i){
    var isActive=G.sel===i;
    return'<div class="res-card" style="'+(isActive?'border-color:var(--g400);background:var(--g50)':'')+';cursor:pointer" onclick="G.sel='+i+';renderG();">'+
      '<div><span class="name">'+r.hoTen+'</span> <span style="font-size:12px;color:var(--x400)">'+r.maHS+' | '+r.lop+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:12px"><span class="score">TN: '+r.tnScore+'/'+r.tnTotal+'</span><span style="font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;background:'+(r.grade==='Giỏi'?'var(--g100)':r.grade==='Khá'?'var(--s100)':r.grade==='TB'?'var(--a50)':'var(--r50)')+';color:'+(r.grade==='Giỏi'?'var(--g700)':r.grade==='Khá'?'var(--s500)':r.grade==='TB'?'var(--a600)':'var(--r500)')+'">'+r.grade+'</span></div></div>';
  }).join('');

  var detail='';
  if(G.sel>=0&&G.sel<G.results.length){
    var r=G.results[G.sel];
    detail='<div class="panel"><div class="panel-title">📝 Chi tiết: '+r.hoTen+'</div>'+
      '<div style="margin-bottom:12px"><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">Đúng/Sai TN:</p><p style="font-size:14px;font-weight:600;color:var(--x700);background:var(--g50);padding:10px;border-radius:10px">'+r.tnDetail+'</p></div>'+
      (r.essayText?'<div style="margin-bottom:12px"><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">Bài tự luận:</p><pre style="font-size:13px;font-weight:600;color:var(--x700);background:var(--g50);padding:10px;border-radius:10px;white-space:pre-wrap;font-family:var(--fb)">'+r.essayText+'</pre></div>':'')+
      '<div style="margin-bottom:12px"><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">💬 Nhận xét của giáo viên:</p><textarea class="comment-textarea" id="gv-comment" placeholder="Nhập nhận xét..."></textarea><div class="canned-tags" style="margin-top:8px">'+canned.map(function(c){return'<button class="canned-tag" onclick="document.getElementById(\'gv-comment\').value+=\' '+c.replace(/'/g,"\\'")+'\'">'+c+'</button>';}).join('')+'</div></div>'+
      '<button class="btn-save" onclick="saveGVComment('+G.sel+')" style="width:100%;justify-content:center">💾 Lưu nhận xét</button></div>';
  }

  el.innerHTML='<div class="teacher-wrap"><div class="topbar"><div class="topbar-inner"><div class="topbar-left"><div class="topbar-icon">📋</div><div><h1 class="hd" style="font-size:20px;color:var(--g800)">Chấm Bài & Kết Quả</h1><p style="font-size:13px;font-weight:600;color:var(--g600)">'+G.results.length+' bài đã nộp</p></div></div><div style="display:flex;gap:8px"><button class="btn-save" onclick="loadResults()">🔄 Tải lại</button><button style="display:flex;align-items:center;gap:8px;padding:10px 20px;font-weight:800;color:white;border-radius:12px;background:linear-gradient(135deg,var(--t500),var(--s500))" onclick="showToast(\'🐝 Ong vàng AI chấm bài sẽ được cập nhật ở phiên bản sau!\')">🤖 AI chấm tất cả</button></div></div></div><div style="max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px"><div class="panel"><div class="panel-title">📊 Danh sách bài nộp</div><div style="max-height:500px;overflow-y:auto">'+list+'</div></div><div>'+detail+'</div></div></div>';
}

function loadResults(){
  G.loading=true;renderG();
  fetch(API+'?action=getResults').then(function(r){return r.json();}).then(function(data){
    G.results=Array.isArray(data)?data:[];G.loading=false;G.sel=G.results.length?0:-1;
    showToast('📊 '+G.results.length+' bài làm');renderG();
  }).catch(function(err){G.loading=false;renderG();showToast('⚠️ Lỗi: '+err.message);});
}

function saveGVComment(idx){
  var r=G.results[idx];var comment=document.getElementById('gv-comment')?.value||'';
  if(!comment){showToast('⚠️ Nhập nhận xét!');return;}
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveComment',maHS:r.maHS,hoTen:r.hoTen,question:'Tổng',score:r.tnScore,comment:comment})})
    .then(function(r){return r.json();}).then(function(){showToast('✅ Đã lưu nhận xét!');})
    .catch(function(err){showToast('⚠️ Lỗi: '+err.message);});
}

renderT();
</script>
</body>
</html>
