function B(sz){return'<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="25" cy="85" rx="30" ry="18" fill="#B3E5FC" opacity=".5" transform="rotate(-25 25 85)"/><ellipse cx="115" cy="85" rx="30" ry="18" fill="#B3E5FC" opacity=".5" transform="rotate(25 115 85)"/><ellipse cx="70" cy="135" rx="30" ry="38" fill="#FFD93D"/><ellipse cx="70" cy="128" rx="28" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="148" rx="29" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="168" rx="27" ry="8" fill="#1a1a2e" opacity=".22"/><ellipse cx="70" cy="75" rx="32" ry="30" fill="#FFD93D"/><path d="M38 65 Q42 45 70 38 Q98 45 102 65 Q94 57 70 55 Q46 57 38 65Z" fill="#1a1a2e"/><ellipse cx="56" cy="72" rx="10" ry="11" fill="white"/><ellipse cx="84" cy="72" rx="10" ry="11" fill="white"/><circle cx="58" cy="72" r="7" fill="#2563EB"/><circle cx="86" cy="72" r="7" fill="#2563EB"/><circle cx="55" cy="68" r="3" fill="white"/><circle cx="83" cy="68" r="3" fill="white"/><path d="M50 88 Q60 100 70 98 Q80 100 90 88" stroke="#1a1a2e" stroke-width="2" fill="#FF6B8A"/><ellipse cx="38" cy="84" rx="7" ry="4" fill="#FF9999" opacity=".3"/><ellipse cx="102" cy="84" rx="7" ry="4" fill="#FF9999" opacity=".3"/><path d="M56 42 Q48 22 40 14" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M84 42 Q92 22 100 14" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="38" cy="12" r="5" fill="#FFD93D"/><circle cx="102" cy="12" r="5" fill="#FFD93D"/></svg>';}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden');},3500);}

// Render fractions: {2/3} → styled fraction
function renderFrac(text){
  if(!text)return'';
  return text.replace(/\{(\d+)\/(\d+)\}/g,function(m,a,b){
    return'<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1"><span style="border-bottom:2px solid currentColor;padding:0 4px;font-size:85%">'+a+'</span><span style="padding:0 4px;font-size:85%">'+b+'</span></span>';
  });
}
// Resize image to max 400px and return base64
function resizeImg(file,maxW,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=h*(maxW/w);w=maxW;}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.7));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function uploadQImg(idx){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    resizeImg(f,400,function(base64){
      T.examData.questions[idx].image=base64;
      showToast('📸 Đã thêm hình cho câu '+(idx+1));
      renderT();
    });
  };inp.click();
}

document.getElementById('d1').innerHTML=B(34);document.getElementById('d2').innerHTML=B(26);document.getElementById('nb').innerHTML=B(30);
document.querySelectorAll('.nav-tab').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.nav-tab').forEach(function(x){x.classList.remove('active');});b.classList.add('active');['teacher','grading','summary'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab);});if(b.dataset.tab==='teacher')renderT();if(b.dataset.tab==='grading')renderG();if(b.dataset.tab==='summary')renderSummary();});});

var CFG={schoolName:"Trường Tiểu Học Diễn Liên",teacherName:"Cô Nguyễn Thị Hoa",subject:"Toán",grade:3,semester:"Cuối năm học",schoolYear:"2025 - 2026",duration:2400,totalPoints:10};
var students=[{stt:1,maHS:'HS001',hoTen:'Nguyễn Văn An',ngaySinh:'15/03/2017',lop:'3A',truong:'TH Diễn Liên'},{stt:2,maHS:'HS002',hoTen:'Trần Thị Bình',ngaySinh:'22/07/2017',lop:'3A',truong:'TH Diễn Liên'},{stt:3,maHS:'HS003',hoTen:'Lê Hoàng Minh',ngaySinh:'01/11/2017',lop:'3B',truong:'TH Diễn Liên'},{stt:4,maHS:'HS004',hoTen:'Phạm Thị Mai',ngaySinh:'30/05/2017',lop:'3B',truong:'TH Diễn Liên'},{stt:5,maHS:'HS005',hoTen:'Hoàng Đức Anh',ngaySinh:'08/09/2017',lop:'3A',truong:'TH Diễn Liên'}];
var canned=["Em làm rất tốt! 🌟","Chú ý lỗi chính tả!","Cần trình bày sạch hơn!","Phép tính đúng! 🐝","Viết đầy đủ lời giải nhé!","Xem lại đáp số.","Cố gắng hơn! 💪","Xuất sắc! 🏆"];
var T={file:null,fileObj:null,parsed:false,examData:null,editingQ:null,saving:false,saved:false,showAddStudent:false,roomCode:null,uploadFile:null,uploadObj:null,aiParsing:false,aiStatus:null,aiMsg:'',previewFile:null,previewData:null,previewType:null};


function showImportModal(){
  var el=document.getElementById('import-modal');
  el.classList.remove('hidden');
  el.innerHTML='<div class="import-overlay" onclick="if(event.target===this)closeImport()"><div class="import-modal"><h2>📥 Nhập Đề Từ AI</h2><p style="font-size:13px;font-weight:600;color:var(--x500);margin-bottom:12px">Mở file <b>AI_BienSoanDe.html</b> trên Claude.ai → upload đề → AI phân tích → copy mã → dán vào đây:</p><textarea class="import-textarea" id="import-data" placeholder="Dán mã đề thi JSON vào đây..."></textarea><div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1;padding:12px;border-radius:10px;font-weight:800;color:white;background:linear-gradient(135deg,var(--g500),var(--t500));border:none;font-size:14px;cursor:pointer" onclick="importFromAI()">📥 Nhập Đề</button><button style="padding:12px 20px;border-radius:10px;font-weight:700;color:var(--x500);background:var(--x100);border:none;cursor:pointer" onclick="closeImport()">Hủy</button></div></div></div>';
}
function closeImport(){document.getElementById('import-modal').classList.add('hidden');}
function importFromAI(){
  var raw=document.getElementById('import-data').value.trim();
  if(!raw){showToast('⚠️ Dán mã đề thi vào!');return;}
  try{
    var data=JSON.parse(raw);
    if(!data.questions||!data.questions.length)throw new Error('Không có câu hỏi');
    T.examData={examId:'exam_ai_'+Date.now(),title:data.title||('KT '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade),questions:data.questions};
    if(data.subject)CFG.subject=data.subject;
    if(data.grade)CFG.grade=data.grade;
    T.parsed=true;T.roomCode=null;
    closeImport();
    showToast('✅ Đã nhập '+data.questions.length+' câu hỏi! GV kiểm tra và chỉnh sửa.');
    renderT();
  }catch(e){showToast('❌ Mã không hợp lệ: '+e.message);}
}

function addQ(type){
  if(!T.examData)T.examData={examId:'exam_'+Date.now(),title:'Kiểm Tra '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade,questions:[]};
  var qs=T.examData.questions,order=qs.length+1,id='q'+order;
  var isTN=(type!=='essay');
  var q={id:id,type:type,cat:isTN?'tn':'tl',order:order,points:isTN?1:2,content:'',correctAnswer:''};
  if(type==='mcq'){q.options=[{id:'a',text:''},{id:'b',text:''},{id:'c',text:''},{id:'d',text:''}];q.correctAnswer='a';}
  if(type==='true_false')q.correctAnswer='true';
  if(type==='fill_in'){q.content='Kết quả của ... là _____ .';q.hint='';}
  if(type==='essay')q.rubric=[{criteriaId:'r1',label:'Nội dung đúng',maxScore:1},{criteriaId:'r2',label:'Đáp số đúng',maxScore:0.5},{criteriaId:'r3',label:'Trình bày',maxScore:0.5}];
  qs.push(q);T.parsed=true;T.editingQ=id;T.roomCode=null;renderT();showToast('➕ Đã thêm câu '+order);
}

function importExamJSON(){

  if(!raw){showToast('⚠️ Dán JSON đề thi vào ô trước!');return;}

    // Try to find JSON in the text
    var jsonStart=raw.indexOf('{');var jsonEnd=raw.lastIndexOf('}');

function parseFromText(){
  var raw=document.getElementById('paste-exam').value.trim();
  if(!raw||raw.length<20){showToast('⚠️ Dán nội dung đề thi vào ô trước!');return;}
  
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
  var questions=[];
  var qNum=0;
  
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    
    // Detect question start: "Câu 1:", "Câu 1.", "Câu 1)", "1.", "1:", "1)", "Bài 1", etc.
    var qMatch=line.match(/^(?:C[aâ]u|B[àa]i|Question)?\s*(\d+)\s*[.:)]\s*(.*)/i);
    if(!qMatch&&line.match(/^(?:C[aâ]u|B[àa]i)\s+(\d+)/i)){qMatch=line.match(/^(?:C[aâ]u|B[àa]i)\s+(\d+)\s*[.:)]?\s*(.*)/i);}
    
    if(qMatch){
      qNum++;
      var qContent=qMatch[2]||'';
      var qId='q'+qNum;
      
      // Look ahead for options (A. B. C. D.) on same line or next lines
      var options=[];
      var optOnSameLine=qContent.match(/\bA[.)]\s*.+\bB[.)]\s*.+/i);
      
      // Check if options are on same line
      if(optOnSameLine){
        var optParts=qContent.match(/(.+?)\s*A[.)]\s*(.+?)\s*B[.)]\s*(.+?)(?:\s*C[.)]\s*(.+?))?(?:\s*D[.)]\s*(.+))?$/i);
        if(optParts){
          qContent=optParts[1].trim();
          if(optParts[2])options.push({id:'a',text:optParts[2].trim()});
          if(optParts[3])options.push({id:'b',text:optParts[3].trim()});
          if(optParts[4])options.push({id:'c',text:optParts[4].trim()});
          if(optParts[5])options.push({id:'d',text:optParts[5].trim()});
        }
      }
      
      // Check next lines for options
      if(!options.length){
        var j=i+1;
        while(j<lines.length){
          var optLine=lines[j];
          var optMatch=optLine.match(/^([A-Da-d])[.)]\s*(.+)/);
          if(optMatch){
            options.push({id:optMatch[1].toLowerCase(),text:optMatch[2].trim()});
            j++;
          } else if(optLine.match(/^(?:C[aâ]u|B[àa]i|Question)?\s*\d+\s*[.:)]/i)){
            break;
          } else if(!qContent&&optLine.length>5){
            // Content might be on next line
            qContent=optLine;
            j++;
          } else {
            // Could be continuation of question content
            if(!options.length&&optLine.length>3){qContent+=' '+optLine;}
            j++;
          }
        }
        i=j-1;
      }
      
      // Determine question type
      var type='essay';var cat='tl';var pts=2;var correctAnswer='';
      
      if(options.length>=3){
        // MCQ
        type='mcq';cat='tn';pts=1;correctAnswer='a';
        // Pad to 4 options
        while(options.length<4)options.push({id:['a','b','c','d'][options.length],text:''});
      } else if(qContent.match(/[Đđ][úu]ng\s*(hay|ho[ặa]c)\s*[Ss]ai/i)||qContent.match(/Đúng hay Sai/i)){
        // True/False
        type='true_false';cat='tn';pts=1;correctAnswer='true';
        qContent=qContent.replace(/^[Đđ][úu]ng\s*(hay|ho[ặa]c)\s*[Ss]ai\s*[:.]?\s*/i,'Đúng hay Sai: ');
      } else if(qContent.match(/_____/)||qContent.match(/\.\.\.\.\./)||qContent.match(/=\s*\?/)){
        // Fill in
        type='fill_in';cat='tn';pts=1;correctAnswer='';
        qContent=qContent.replace(/\.{3,}/g,'_____');
        if(!qContent.match(/_____/)&&qContent.match(/=\s*\?/)){
          qContent=qContent.replace(/=\s*\?/,'= _____');
        }
      } else if(options.length===0&&qContent.length>30){
        // Essay (long question, no options)
        type='essay';cat='tl';pts=2;
      } else if(options.length===0){
        // Short question without options - could be fill_in
        type='fill_in';cat='tn';pts=1;
        if(!qContent.match(/_____/))qContent+=' = _____';
      }
      
      var q={id:qId,type:type,cat:cat,order:qNum,points:pts,content:qContent,correctAnswer:correctAnswer};
      if(type==='mcq')q.options=options;
      if(type==='fill_in')q.hint='';
      if(type==='essay')q.rubric=[{criteriaId:'r1',label:'Nội dung đúng',maxScore:1},{criteriaId:'r2',label:'Đáp số đúng',maxScore:0.5},{criteriaId:'r3',label:'Trình bày',maxScore:0.5}];
      
      questions.push(q);
    }
  }
  
  if(!questions.length){
    showToast('⚠️ Không nhận diện được câu hỏi. Đảm bảo mỗi câu bắt đầu bằng "Câu 1:", "1.", "Bài 1"...');
    return;
  }
  
  // Auto-balance points to total 10
  var tnCount=questions.filter(function(q){return q.cat==='tn';}).length;
  var tlCount=questions.filter(function(q){return q.cat==='tl';}).length;
  if(tnCount+tlCount>0){
    var tnPts=tnCount?Math.round(6/tnCount*2)/2:0;// round to 0.5
    var tlPts=tlCount?Math.round(4/tlCount*2)/2:0;
    if(tnPts<0.5)tnPts=0.5;if(tlPts<0.5)tlPts=0.5;
    questions.forEach(function(q){q.points=q.cat==='tn'?tnPts:tlPts;});
  }
  
  T.examData={examId:'exam_parse_'+Date.now(),title:'Kiểm Tra '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade,questions:questions};
  T.parsed=true;T.roomCode=null;T.editingQ=null;
  showToast('✅ Đã nhận diện '+questions.length+' câu hỏi! (TN: '+tnCount+', TL: '+tlCount+') — GV kiểm tra lại đáp án!');
  renderT();
}

      renderT();
    }).catch(function(err){T.aiParsing=false;T.aiStatus='error';T.aiMsg='Loi: '+err.message;renderT();});
  };

  if(!T.examData||!T.examData.questions.length){showToast('⚠️ Chưa có câu hỏi!');return;}
  T.saving=true;renderT();
  var exam={title:T.examData.title||('Kiểm Tra '+CFG.semester+' - '+CFG.subject+' Lớp '+CFG.grade),questions:T.examData.questions};
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publishExam',exam:exam,config:CFG})})
    .then(function(r){return r.json();}).then(function(data){
      T.saving=false;T.saved=true;
      if(data.success&&data.roomCode){T.roomCode=data.roomCode;showToast('✅ Mã phòng thi: '+data.roomCode);}

      renderT();setTimeout(function(){T.saved=false;renderT();},5000);
    }).catch(function(err){T.saving=false;renderT();showToast('⚠️ Lỗi: '+err.message);});
}

function loadSummary(){
  var code=document.getElementById('sum-code')?document.getElementById('sum-code').value.trim().toUpperCase():(T.roomCode||SUM.roomCode);
  if(!code){showToast('⚠️ Nhập mã phòng!');return;}
  SUM.roomCode=code;SUM.loading=true;renderSummary();
  fetch(API+'?action=getResults&code='+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(data){
    SUM.results=Array.isArray(data)?data:[];SUM.loading=false;
    if(!SUM.results.length)showToast('📭 Chưa có bài nộp cho mã '+code);
    else showToast('📊 '+SUM.results.length+' kết quả');
    renderSummary();
  }).catch(function(err){SUM.loading=false;renderSummary();showToast('⚠️ '+err.message);});
}

function printSummary(){
  // Show print elements
  var ph=document.getElementById('print-header');if(ph)ph.style.display='block';
  var ps=document.getElementById('print-sign');if(ps)ps.style.display='flex';
  window.print();
  // Hide after print
  setTimeout(function(){if(ph)ph.style.display='none';if(ps)ps.style.display='none';},1000);
}

  '<div class="panel"><div class="panel-title">🏫 Thông tin bài kiểm tra</div><div class="cfg-form"><div class="cfg-f"><label>Tên trường</label><input value="'+CFG.schoolName+'" onchange="CFG.schoolName=this.value"></div><div class="cfg-row"><div class="cfg-f"><label>Giáo viên</label><input value="'+CFG.teacherName+'" onchange="CFG.teacherName=this.value"></div><div class="cfg-f"><label>Năm học</label><input value="'+CFG.schoolYear+'" onchange="CFG.schoolYear=this.value"></div></div><div class="cfg-row"><div class="cfg-f"><label>Môn học</label><select onchange="CFG.subject=this.value">'+subs.map(function(s){return'<option'+(CFG.subject===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div><div class="cfg-f"><label>Lớp</label><select onchange="CFG.grade=+this.value">'+[1,2,3,4,5].map(function(g){return'<option value="'+g+'"'+(CFG.grade===g?' selected':'')+'>'+g+'</option>';}).join('')+'</select></div></div><div class="cfg-row"><div class="cfg-f"><label>Kỳ kiểm tra</label><select onchange="CFG.semester=this.value">'+sems.map(function(s){return'<option'+(CFG.semester===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div><div class="cfg-f"><label>Thời gian (phút)</label><input type="number" value="'+Math.floor(CFG.duration/60)+'" onchange="CFG.duration=+this.value*60"></div></div></div></div>'+
  '<div class="panel" style="margin-top:16px"><div class="panel-title">👩‍🎓 Học sinh <span style="margin-left:auto;font-size:13px;color:var(--g500)">'+students.length+' em</span></div><div style="display:flex;gap:8px;margin-bottom:8px"><button style="padding:8px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:var(--g500)" onclick="T.showAddStudent=true;renderT();">➕ Thêm HS</button></div>'+addForm+'<div style="max-height:180px;overflow-y:auto"><table class="stu-table"><thead><tr><th>TT</th><th>Mã</th><th>Họ tên</th><th>NS</th><th>Lớp</th><th>Trường</th><th></th></tr></thead><tbody>'+stuRows+'</tbody></table></div></div>'+
  '<div class="panel" style="margin-top:16px"><div class="panel-title">✏️ Biên soạn đề thi</div><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--g500),var(--t500))" onclick="addQ(\'mcq\')">➕ Chọn ĐA</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--t500),var(--s500))" onclick="addQ(\'true_false\')">➕ Đúng/Sai</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,var(--s500),#6366F1)" onclick="addQ(\'fill_in\')">➕ Điền khuyết</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,#EC4899,#F43F5E)" onclick="addQ(\'essay\')">➕ Tự luận</button><button style="padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;color:white;background:linear-gradient(135deg,#6366F1,#8B5CF6)" onclick="showImportModal()">📥 Nhập đề từ AI</button></div>'+
  (T.examData&&T.examData.questions.length?'<div style="padding:10px 14px;background:var(--g50);border-radius:10px;border:1px solid var(--g200);font-size:13px;font-weight:700;color:var(--g700)">📋 '+T.examData.questions.length+' câu | TN: '+T.examData.questions.filter(function(q){return q.cat==="tn";}).length+' | TL: '+T.examData.questions.filter(function(q){return q.cat==="tl";}).length+' | Tổng: '+T.examData.questions.reduce(function(s,q){return s+q.points;},0)+'đ</div>':'<div style="padding:14px;background:var(--a50);border-radius:10px;border:1px solid var(--a200);text-align:center;font-size:13px;font-weight:700;color:var(--a600)">💡 Bấm các nút trên để thêm câu hỏi</div>')+
  '</div>'+
  '<div class="panel" style="margin-top:16px"><div class="panel-title">🧠 AI Biên Soạn Đề'+(T.aiStatus?'<span style="margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;'+(T.aiStatus==='success'?'background:var(--g100);color:var(--g700)':T.aiStatus==='error'?'background:var(--r50);color:var(--r500)':'background:var(--a50);color:var(--a600)')+'">'+T.aiMsg+'</span>':'')+'</div><div style="border:3px dashed '+(T.uploadFile?'var(--t400)':'var(--g300)')+';border-radius:14px;padding:'+(T.uploadFile?'16px':'28px')+';text-align:center;cursor:pointer;background:'+(T.uploadFile?'var(--t50)':'var(--g50)')+'" onclick="trigUpload()" ondragover="event.preventDefault()" ondrop="event.preventDefault();handleDrop(event)">'+(T.uploadFile?'<p style="font-size:15px;font-weight:800;color:var(--t600)">📄 '+T.uploadFile.name+'</p><p style="font-size:12px;color:var(--t500)">'+(T.uploadFile.size/1024).toFixed(0)+' KB</p><button style="margin-top:4px;color:var(--r400);font-size:12px;font-weight:700;background:none" onclick="event.stopPropagation();T.uploadFile=null;T.uploadObj=null;T.aiStatus=null;T.aiMsg=String();renderT();">✕ Xóa</button>':'<div style="font-size:40px;margin-bottom:8px">📎</div><p style="font-size:16px;font-weight:700;color:var(--g700)">Tải file đề thi lên</p><p style="font-size:12px;font-weight:600;color:var(--g600)">PDF hoặc Ảnh chụp đề (PNG, JPG)</p>')+'</div>'+(T.uploadFile&&!T.aiParsing?'<button style="margin-top:10px;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--g500),var(--t500));box-shadow:0 4px 16px rgba(16,185,129,.3)" onclick="parseWithAI()">🧠 Ong Vàng AI Phân Tích Đề</button>':'')+(T.aiParsing?'<div style="margin-top:10px;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--g500),var(--t500));opacity:.7"><span class="spinner">⏳</span> Ong vàng đang đọc đề...</div>':'')+'<p style="font-size:11px;color:var(--g600);margin-top:8px;font-weight:600">🐝 AI đọc file → phân loại câu hỏi → tạo đáp án → GV kiểm tra</p></div>'+
  '</div><div style="animation:fadeIn .6s ease-out"><div class="panel" style="min-height:400px"><div class="panel-title">👁️ Xem trước & Chỉnh sửa</div>'+(!T.parsed?'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:250px;color:var(--g300)"><div style="animation:floatBee 3s ease-in-out infinite;opacity:.6">'+B(64)+'</div><p style="margin-top:16px;font-size:16px;font-weight:700">Thêm câu hỏi để bắt đầu</p></div>':'<div style="max-height:800px;overflow-y:auto;padding-right:8px">'+T.examData.questions.map(function(q,i){return rTQ(q,i);}).join('')+'</div>')+'</div></div></div></div>';
}

function rTQ(q,i){var isTN=q.cat==='tn';var subL={mcq:'Chọn ĐA',true_false:'Đ/S',fill_in:'Điền',essay:'TL'};var ed=T.editingQ===q.id;var b='';
if(ed){b='<textarea style="width:100%;padding:8px;border:2px solid var(--g200);border-radius:10px;font-size:13px;resize:none;font-family:var(--fb)" rows="2" onchange="T.examData.questions['+i+'].content=this.value">'+q.content+'</textarea>';
b+='<div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap"><span style="font-size:10px;font-weight:600;color:var(--t600);background:var(--t50);padding:2px 8px;border-radius:6px">💡 Phân số: gõ {2/3} → ²⁄₃</span><button style="padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;color:var(--s500);background:var(--s50);border:1px solid var(--s100)" onclick="uploadQImg('+i+')">📸 Thêm hình</button>'+(q.image?'<button style="padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;color:var(--r400);background:var(--r50);border:1px solid var(--r100)" onclick="T.examData.questions['+i+'].image=null;renderT();">✕ Xóa hình</button>':'')+'</div>';
if(q.image)b+='<div style="margin-top:8px;border-radius:10px;overflow:hidden;border:2px solid var(--g200);display:inline-block"><img src="'+q.image+'" style="max-width:200px;display:block"></div>';
if(q.type==='mcq')b+=q.options.map(function(o){return'<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><button class="opt-correct-btn '+(q.correctAnswer===o.id?'correct':'')+'" onclick="T.examData.questions['+i+'].correctAnswer=\''+o.id+'\';renderT();">'+(q.correctAnswer===o.id?'✓':o.id.toUpperCase())+'</button><input style="flex:1;padding:6px;border:2px solid var(--g200);border-radius:8px;font-size:13px;font-family:var(--fb)" value="'+o.text+'" onchange="T.examData.questions['+i+'].options.find(function(x){return x.id===\''+o.id+'\'}).text=this.value"></div>';}).join('');
if(q.type==='true_false')b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">ĐA:</span><select style="padding:6px;border:2px solid var(--g200);border-radius:8px;font-weight:700" onchange="T.examData.questions['+i+'].correctAnswer=this.value"><option value="true"'+(q.correctAnswer==='true'?' selected':'')+'>Đúng</option><option value="false"'+(q.correctAnswer==='false'?' selected':'')+'>Sai</option></select></div>';
if(q.type==='fill_in'){b+='<p style="font-size:11px;color:var(--a600);margin-top:4px;font-weight:600">💡 Dùng _____ (5 gạch dưới) để đánh dấu chỗ trống</p>';b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">ĐA:</span><input style="flex:1;padding:6px;border:2px solid var(--t400);border-radius:8px;font-size:13px;font-weight:700;color:var(--g700)" value="'+q.correctAnswer+'" onchange="T.examData.questions['+i+'].correctAnswer=this.value"></div>';b+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--g700)">Gợi ý:</span><input style="flex:1;padding:6px;border:2px solid var(--g200);border-radius:8px;font-size:13px" value="'+(q.hint||'')+'" onchange="T.examData.questions['+i+'].hint=this.value" placeholder="Tùy chọn"></div>';}
}else{b='<div style="font-size:13px;font-weight:600;color:var(--x700)">'+(q.content?renderFrac(q.content):'<em style="color:var(--x400)">(Chưa nhập)</em>')+'</div>';
if(q.image)b+='<div style="margin-top:6px;border-radius:8px;overflow:hidden;border:2px solid var(--g200);display:inline-block"><img src="'+q.image+'" style="max-width:180px;display:block"></div>';
if(q.type==='mcq'&&q.options)b+='<div class="opt-grid">'+q.options.map(function(o){return'<div class="opt-preview '+(q.correctAnswer===o.id?'correct':'wrong')+'">'+o.id.toUpperCase()+'. '+(o.text||'...')+'</div>';}).join('')+'</div>';
if(q.type==='true_false')b+='<div style="margin-top:6px"><span class="opt-preview correct" style="display:inline-block">ĐA: '+(q.correctAnswer==='true'?'Đúng':'Sai')+'</span></div>';
if(q.type==='fill_in')b+='<div style="margin-top:6px"><span class="opt-preview correct" style="display:inline-block">ĐA: '+(q.correctAnswer||'...')+'</span></div>';}
return'<div class="q-edit-card '+(ed?'editing':'')+'"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:'+(isTN?'var(--t100)':'var(--r100)')+';color:'+(isTN?'var(--t600)':'var(--r500)')+'">'+(isTN?'TN':'TL')+'</span><span style="font-size:10px;font-weight:600;color:var(--x400);background:var(--x100);padding:1px 6px;border-radius:4px">'+subL[q.type]+'</span><span style="font-size:13px;font-weight:700;color:var(--g800)">Câu '+(i+1)+'</span><input type="number" style="width:50px;padding:2px 6px;border:2px solid var(--g300);border-radius:6px;font-size:12px;font-weight:800;color:var(--g700);text-align:center;font-family:var(--fd)" value="'+q.points+'" min="0.5" max="10" step="0.5" onchange="T.examData.questions['+i+'].points=+this.value;T.roomCode=null;renderT();" title="Điểm"><span style="font-size:11px;font-weight:600;color:var(--g600)">đ</span></div><div style="display:flex;gap:4px"><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:12px" onclick="moveQ('+i+',-1)">⬆</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:12px" onclick="moveQ('+i+',1)">⬇</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--g600);font-size:14px" onclick="T.editingQ=T.editingQ===\''+q.id+'\'?null:\''+q.id+'\';renderT();">✏️</button><button style="padding:3px 6px;border-radius:6px;background:none;color:var(--r400);font-size:12px" onclick="if(confirm(\'Xóa câu '+(i+1)+'?\'))deleteQ('+i+')">🗑</button></div></div>'+b+'</div>';}

/* ═══ GRADING ═══ */
var G={results:[],loading:false,sel:-1,roomCode:''};

function renderG(){
  var el=document.getElementById('tab-grading');
  if(!G.results.length&&!G.loading){
    el.innerHTML='<div class="teacher-wrap"><div class="topbar"><div class="topbar-inner"><div class="topbar-left"><div class="topbar-icon">📋</div><div><h1 class="hd" style="font-size:20px;color:var(--g800)">Chấm Bài & Kết Quả</h1></div></div><div style="display:flex;gap:8px"><button style="display:flex;align-items:center;gap:8px;padding:10px 20px;font-weight:800;color:white;border-radius:12px;background:linear-gradient(135deg,var(--t500),var(--s500))" onclick="showToast(\'🐝 Ong vàng AI chấm bài sẽ được cập nhật ở phiên bản sau!\')">🤖 AI chấm bài</button></div></div></div><div style="max-width:600px;margin:0 auto;padding:40px;text-align:center"><div style="animation:floatBee 3s ease-in-out infinite;display:flex;justify-content:center;margin-bottom:16px;opacity:.5">'+B(64)+'</div><p style="font-size:14px;font-weight:700;color:var(--g600);margin-bottom:16px">Nhập mã phòng thi để xem kết quả:</p><input style="width:100%;padding:16px;border:3px solid var(--g300);border-radius:14px;font-size:24px;font-weight:900;text-align:center;font-family:var(--fd);letter-spacing:4px;color:var(--g700);text-transform:uppercase" id="grade-code" placeholder="ONG-0000" value="'+(T.roomCode||G.roomCode||'')+'"><button class="btn-save" style="margin-top:12px;width:100%;justify-content:center;padding:14px" onclick="loadResults()">📥 Tải kết quả</button></div></div>';
    return;
  }
  if(G.loading){el.innerHTML='<div class="teacher-wrap"><div style="padding:60px;text-align:center"><span class="spinner">⏳</span> Đang tải...</div></div>';return;}
  var list=G.results.map(function(r,i){return'<div class="res-card'+(G.sel===i?' active':'')+'" onclick="G.sel='+i+';renderG();"><div><span style="font-weight:800;color:var(--g800)">'+r.hoTen+'</span> <span style="font-size:12px;color:var(--x400)">'+r.maHS+' | '+r.lop+'</span></div><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:800;font-family:var(--fd);color:var(--g600)">'+r.tnScore+'/'+r.tnTotal+'</span></div></div>';}).join('');
  var detail='';
  if(G.sel>=0&&G.sel<G.results.length){var r=G.results[G.sel];
    detail='<div class="panel"><div class="panel-title">📝 '+r.hoTen+' ('+r.maHS+')</div><div style="margin-bottom:12px"><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">Đúng/Sai TN:</p><p style="font-size:14px;font-weight:600;color:var(--x700);background:var(--g50);padding:10px;border-radius:10px">'+(r.tnDetail||'—')+'</p></div>'+(r.essayText?'<div style="margin-bottom:12px"><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">Bài tự luận:</p><pre style="font-size:13px;font-weight:600;color:var(--x700);background:var(--g50);padding:10px;border-radius:10px;white-space:pre-wrap;font-family:var(--fb)">'+r.essayText+'</pre></div>':'')+'<div><p style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px">💬 Nhận xét:</p><textarea style="width:100%;height:80px;padding:10px;border:2px solid var(--g200);border-radius:10px;font-size:13px;resize:none;font-weight:600" id="gv-cmt" placeholder="Nhận xét..."></textarea><div class="canned-tags" style="margin-top:8px">'+canned.map(function(c){return'<button class="canned-tag" onclick="document.getElementById(\'gv-cmt\').value+=\' '+c.replace(/'/g,"\\'")+'\'">'+c+'</button>';}).join('')+'</div><button class="btn-save" style="margin-top:12px;width:100%;justify-content:center" onclick="saveCmt('+G.sel+')">💾 Lưu nhận xét</button></div></div>';}
  el.innerHTML='<div class="teacher-wrap"><div class="topbar"><div class="topbar-inner"><div class="topbar-left"><div class="topbar-icon">📋</div><div><h1 class="hd" style="font-size:20px;color:var(--g800)">Kết quả — <span style="color:var(--t600)">'+G.roomCode+'</span></h1><p style="font-size:13px;font-weight:600;color:var(--g600)">'+G.results.length+' bài đã nộp</p></div></div><div style="display:flex;gap:8px"><button class="btn-save" onclick="loadResults()">🔄 Tải lại</button><button style="display:flex;align-items:center;gap:8px;padding:10px 20px;font-weight:800;color:white;border-radius:12px;background:linear-gradient(135deg,var(--t500),var(--s500))" onclick="showToast(\'🐝 Ong vàng AI chấm bài sẽ được cập nhật ở phiên bản sau!\')">🤖 AI chấm bài</button></div></div></div><div class="ggrid"><div class="panel"><div class="panel-title">📊 Danh sách</div><div style="max-height:500px;overflow-y:auto">'+list+'</div></div><div>'+detail+'</div></div></div>';
}

function loadResults(){
  var code=document.getElementById('grade-code')?document.getElementById('grade-code').value.trim().toUpperCase():(T.roomCode||G.roomCode);
  if(!code){showToast('⚠️ Nhập mã phòng!');return;}
  G.roomCode=code;G.loading=true;renderG();
  fetch(API+'?action=getResults&code='+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(data){
    G.results=Array.isArray(data)?data:[];G.loading=false;G.sel=G.results.length?0:-1;showToast('📊 '+G.results.length+' bài');renderG();
  }).catch(function(err){G.loading=false;renderG();showToast('⚠️ '+err.message);});
}

function saveCmt(idx){
  var r=G.results[idx];var cmt=document.getElementById('gv-cmt').value;
  if(!cmt){showToast('⚠️ Nhập nhận xét!');return;}
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveComment',roomCode:G.roomCode,maHS:r.maHS,hoTen:r.hoTen,question:'Tổng',score:r.tnScore,comment:cmt})})
    .then(function(){showToast('✅ Đã lưu!');}).catch(function(err){showToast('⚠️ '+err.message);});
}

renderT();
</script>
